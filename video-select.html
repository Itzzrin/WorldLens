<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldLens - Seleccionar Video</title>
    <link rel="stylesheet" href="common.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="video-select.css" />
  </head>
  <body>
    <header class="header">
      <h1><i class="fas fa-globe-americas"></i> WorldLens</h1>
    </header>

    <main class="app">
      <div class="video-select-header">
        <button class="back-btn" onclick="goTo('index.html')">
          <i class="fas fa-arrow-left"></i> Volver
        </button>
        <h2>Selecciona un video</h2>
      </div>

      <div class="video-select-content">
        <div class="video-grid">
          <!-- Video 1 -->
          <div
            class="video-thumb"
            onclick="selectVideo(this)"
            data-video-src="https://res.cloudinary.com/dmx4kc4hu/video/upload/v1777354934/M%C3%A9xico_v3akbd.mp4"
            data-title="México"
          >
            <img
              src="videos/thumbs/México.png"
              alt="México"
              onerror="
                this.style.display = 'none';
                this.parentNode.classList.add('no-thumb');
              "
            />
            <div class="video-overlay">
              <i class="fas fa-play-circle"></i>
              <span>México</span>
            </div>
            <div class="video-duration">0:19</div>
          </div>

            data-video-src="https://res.cloudinary.com/dmx4kc4hu/video/upload/v1777354937/Sud%C3%A1frica_zo9r43.mp4"

          >
            <img

           <img

        </div>

        <button
          id="editBtn"
          class="primary-btn disabled"
          onclick="goToEditor()"
        >
          <i class="fas fa-edit"></i> Editar video seleccionado
        </button>
      </div>
    </main>

    <script src="common.js"></script>
    <script src="video-select.js"></script>
  </body>
</html>
